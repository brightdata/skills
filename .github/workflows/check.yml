name: check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SKILL.md frontmatter
        run: bash .github/scripts/check_skills.sh

      - name: shellcheck
        run: |
          files=$(git ls-files | while IFS= read -r f; do
            case "$f" in
              *.sh) echo "$f" ;;
              *) if head -n1 "$f" | grep -qE '^#!.*\b(ba)?sh\b'; then echo "$f"; fi ;;
            esac
          done)
          echo "$files"
          [ -z "$files" ] || echo "$files" | xargs shellcheck
